<figure class="event-figure">
  <a href="{{ include.src | relative_url }}" aria-label="View full image: {{ include.alt | escape }}">
    <img src="{{ include.src | relative_url }}"
         alt="{{ include.alt | escape }}"
         width="{{ include.width }}"
         height="{{ include.height }}"
         loading="{{ include.loading | default: 'lazy' }}"
         decoding="async">
  </a>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
